when:
  - event: ["push", "manual"]
    branch: ["main"]
  - event: schedule
    schedule:
      - cron: "H */6 * * *"

engine: "nixery"

environment:
  JEKYLL_ENV: "production"

dependencies:
  nixpkgs:
    - ruby_3_3
    - nodejs
    - git
    - gcc
    - gnumake
    - pkg-config

cache:
  - key: bundle
    hash:
      - Gemfile.lock
    paths:
      - vendor/bundle

steps:
  - name: "Fetch PDS data"
    command: ruby script/fetch_pds_data.rb
  - name: "Install gems"
    command: |
      gem install bundler --no-document
      bundle config set path vendor/bundle
      bundle install
  - name: "Build site"
    command: bundle exec jekyll build
  - name: "Deploy"
    command: |
      if [ -z "$(git status --porcelain -- _data/)" ]; then
        echo "No changes in _data/, skipping deploy"
      else
        npx wrangler deploy
      fi
