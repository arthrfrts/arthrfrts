# .tangled/workflows/deploy.yml
# Build and deploy the site on every push to the default branch,
# or when triggered manually from the Tangled pipelines page.
when:
  - event: ["push", "manual"]
    branch: ["main"] # adjust if your default branch has another name

engine: "nixery"

environment:
  JEKYLL_ENV: "production" # matches what Cloudflare Pages sets for builds

dependencies:
  nixpkgs:
    - ruby_3_3
    - nodejs # for npx wrangler

cache:
  # Optional: only effective if the spindle operator configured a cache backend.
  - key: bundle
    hash:
      - Gemfile.lock
    paths:
      - vendor/bundle

steps:
  - name: "Install gems"
    command: |
      gem install bundler --no-document
      bundle config set path vendor/bundle
      bundle install
  - name: "Build site"
    command: bundle exec jekyll build
  - name: "Deploy"
    # Reads CLOUDFLARE_API_TOKEN (and CLOUDFLARE_ACCOUNT_ID if set)
    # from the repository's Settings -> Secrets.
    command: npx wrangler deploy
